<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" shape-rendering="crispEdges">
  <!-- Wings (translucent light cyan/white) -->
  <rect x="10" y="4" width="4" height="2" fill="#23D9FF" opacity="0.8"/>
  <rect x="8" y="6" width="8" height="4" fill="#E6FBFF" opacity="0.9"/>
  <rect x="18" y="4" width="4" height="2" fill="#23D9FF" opacity="0.8"/>
  <rect x="16" y="6" width="8" height="4" fill="#E6FBFF" opacity="0.9"/>

  <!-- Antennae -->
  <rect x="10" y="8" width="2" height="2" fill="#07152F"/>
  <rect x="8" y="10" width="2" height="2" fill="#07152F"/>
  <rect x="20" y="8" width="2" height="2" fill="#07152F"/>
  <rect x="22" y="10" width="2" height="2" fill="#07152F"/>

  <!-- Main Body Outline -->
  <rect x="6" y="12" width="20" height="14" fill="#07152F"/>

  <!-- Yellow Body Base -->
  <rect x="8" y="14" width="16" height="10" fill="#FFD633"/>

  <!-- Black Stripes -->
  <rect x="12" y="14" width="3" height="10" fill="#0A2148"/>
  <rect x="18" y="14" width="3" height="10" fill="#0A2148"/>

  <!-- Eyes -->
  <rect x="21" y="16" width="2" height="3" fill="#07152F"/>
  <rect x="21" y="16" width="1" height="1" fill="#FFFFFF"/>

  <!-- Cheeks -->
  <rect x="20" y="20" width="2" height="1" fill="#FF8A32"/>

  <!-- Belly Highlight -->
  <rect x="9" y="22" width="2" height="1" fill="#FFEAA7"/>
  <rect x="15" y="22" width="2" height="1" fill="#FFEAA7"/>

  <!-- Cute Stinger -->
  <rect x="5" y="18" width="2" height="2" fill="#07152F"/>
</svg>
